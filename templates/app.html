<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner - PhishChecker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container app-container">
        <header class="app-header">
            <a href="/" class="back-link">← Home</a>
            <h2>Threat Scanner</h2>
        </header>

        <div class="input-section">
            <input type="text" id="url-input" placeholder="Paste URL here (e.g., https://example.com)" autocomplete="off">
            <button id="scan-btn" class="btn primary-btn">Analyze</button>
        </div>

        <div id="loading-state" class="state-panel hidden">
            <div class="spinner"></div>
            <p>Scanning heuristics and gathering AI internet intelligence...<br><small>(This usually takes 3-6 seconds)</small></p>
        </div>

        <div id="error-state" class="state-panel hidden">
            <p id="error-text" class="error-msg">An error occurred.</p>
        </div>

        <div id="results-state" class="hidden">
            <div class="result-banner" id="verdict-banner">
                <h1 id="verdict-title">Evaluating...</h1>
                <p>Heuristic Risk Score: <span id="score-text">0.0</span></p>
            </div>

            <div class="results-grid">
                <div class="card ai-card">
                    <h3>🤖 AI OSINT Consensus</h3>
                    <p id="ai-summary-text">AI is thinking...</p>
                </div>

                <div class="card triggers-card">
                    <h3>🔍 Technical Triggers</h3>
                    <ul id="reasons-list">
                        </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
